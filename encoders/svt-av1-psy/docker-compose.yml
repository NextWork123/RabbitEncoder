services:
  svt-av1-psy-builder:
    build:
      context: .
      args:
        SVTAV1PSY_REPO: https://github.com/5fish/svt-av1-psy.git
    container_name: rabbit-svt-av1-psy-builder
    volumes:
      - ./svt-av1-psy-dist:/out
    environment:
      DEBIAN_FRONTEND: noninteractive
      # Set to 0 to disable profile-guided optimization (faster build, slightly
      # slower encoder). PGO is otherwise applied per-level when the build host
      # can execute that micro-architecture (v4/AVX-512 needs an AVX-512 host).
      ENABLE_PGO: "1"
    tty: true
