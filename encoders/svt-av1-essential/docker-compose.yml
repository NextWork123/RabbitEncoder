services:
  svt-av1-essential-builder:
    build:
      context: .
      args:
        SVTAV1ESSENTIAL_REPO: https://github.com/nekotrix/SVT-AV1-Essential.git
        SVTAV1ESSENTIAL_REF: v4.0.1-Essential
    container_name: rabbit-svt-av1-essential-builder
    volumes:
      - ./svt-av1-essential-dist:/out
    environment:
      DEBIAN_FRONTEND: noninteractive
      # Set to 0 to disable profile-guided optimization (faster build, slightly
      # slower encoder). PGO is otherwise applied per-level when the build host
      # can execute that micro-architecture (v4/AVX-512 needs an AVX-512 host).
      ENABLE_PGO: "1"
    tty: true
